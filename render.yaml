services:
  - type: web
    name: theplug-api
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python server.py"
    envVars:
      - key: APIFY_TOKEN
        sync: false          # paste it in the Render dashboard, never in git
      - key: APIFY_ACTOR
        value: clockworks~tiktok-comments-scraper
      - key: PYTHON_VERSION
        value: "3.12"
